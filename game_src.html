<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>纸之魔女 · 沙盒原型</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#efeadf;font-family:"Segoe Print","Bradley Hand","Comic Sans MS","Kaiti SC","STKaiti","KaiTi",cursive;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
#hud{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;text-align:center;background:#f7f3eadd;border-radius:8px;padding:0 10px;font-size:16px!important;color:#2a2622;font-size:15px;line-height:1.5;pointer-events:none}
#hud b{font-size:22px;letter-spacing:.08em}
#forms{position:fixed;left:12px;bottom:12px;display:flex;gap:6px}
#inv{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:4px;padding:6px;background:#f7f3eaee;border:2px solid #2a2622;border-radius:12px 9px 13px 10px;box-shadow:2px 3px 0 #2a262244}
.slot{width:50px;height:50px;border:1.5px solid #2a262288;border-radius:7px;position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center;background:#fbf8f1}
.slot img{max-width:42px;max-height:42px}.slot span{position:absolute;right:3px;bottom:0;font-size:13px;font-weight:bold}.slot i{position:absolute;left:3px;top:0;font-size:10px;opacity:.45;font-style:normal}.slot.eq{border:2.5px solid #2a2622;background:#e4dccb}
#craft{position:fixed;left:12px;top:96px;width:210px;background:#f7f3eaee;border:2px solid #2a2622;border-radius:10px 13px 9px 12px;padding:6px 8px;font-size:13px;color:#2a2622;box-shadow:2px 3px 0 #2a262244}
.rc{display:flex;gap:6px;align-items:center;padding:4px;border-radius:6px;cursor:pointer;opacity:.45;border:1px dashed transparent}.rc.ok{opacity:1;border-color:#2a262266}.rc:hover{background:#e9e2d3}.rc img{width:36px;height:36px;object-fit:contain}.rn{font-weight:bold;font-size:14px}.rq{font-size:11px}.rd{font-size:10px;opacity:.7}
#cmd{position:fixed;left:50%;top:10px;transform:translateX(-50%);max-width:46vw;background:#2a2622;color:#f3efe6;border-radius:10px 14px 9px 13px;padding:7px 16px;font-size:14px;text-align:center;box-shadow:2px 3px 0 #0005}
#cmd b{letter-spacing:.2em;font-size:12px;opacity:.75}
.fb{width:58px;height:62px;border:2px solid #2a2622;border-radius:10px 14px 9px 13px;background:#f7f3ea;box-shadow:2px 3px 0 #2a262255;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:13px;color:#2a2622;position:relative}
.fb img{height:34px}
.fb.on{background:#ddd3bf;transform:translateY(-4px);box-shadow:2px 6px 0 #2a262266;border-width:3px}

#side{position:fixed;right:12px;top:118px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.sb{border:2px solid #2a2622;border-radius:8px 11px 7px 10px;background:#f7f3ea;padding:5px 10px;font-size:14px;cursor:pointer;box-shadow:2px 2px 0 #2a262244;color:#2a2622;font-family:inherit}
#act{position:fixed;right:24px;bottom:24px;width:92px;height:92px;border-radius:50%;border:3px solid #2a2622;background:#f7f3ea;font-size:17px;font-family:inherit;box-shadow:3px 4px 0 #2a262255;color:#2a2622;cursor:pointer}
#help{position:fixed;right:12px;top:292px;text-align:right;background:#f7f3eacc;border-radius:6px;padding:3px 6px;font-size:11px!important;font-size:13px;color:#2a2622cc;line-height:1.45;pointer-events:none;max-width:300px}
#title{position:fixed;inset:0;background:#efeadf;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9;cursor:pointer}
#title h1{font-size:64px;margin:0;letter-spacing:.2em;color:#2a2622;font-weight:normal}
#title p{color:#555;margin:10px}
#title .go{margin-top:26px;border:2px solid #2a2622;padding:10px 34px;font-size:22px;border-radius:12px 8px 14px 9px;box-shadow:3px 3px 0 #2a262255;background:#f7f3ea}
</style></head><body>
<canvas id="cv"></canvas>
<div id="hud"><span id="tip" style="opacity:.8"></span></div><div id="cmd"></div><div id="craft"></div><div id="inv"></div>
<div id="side">
  <button class="sb" id="bProp">比例：Q版</button>
  <button class="sb" id="bDemon">恶魔：D4 冷淡</button>
  <button class="sb" id="bRotL">⟲ 转视角 (Q)</button>
  <button class="sb" id="bRotR">⟳ 转视角 (E)</button>
</div>
<div id="forms"></div>
<button id="act">动作<br><small>空格</small></button>
<div id="help">WASD / 点击地面 移动 · Q/E 转视角 · 滚轮 缩放<br>空格：采集 / 砍树 / 献给主人 · 点物品栏：吃 / 装备 / 添柴<br>1 人形 · 2 狗(挖) · 3 独角兽(撞石) · 4 鸟(飞过河)</div>
<div id="title"><h1>纸之魔女</h1><p>素描线稿 · 沙盒原型 v0.3</p><p style="font-size:15px;max-width:520px;text-align:center;line-height:1.9">她曾经是自由的魔女。<br>直到那天，她翻开了一本黑色的书。<br>……醒来时，她只记得一件事——<b>主人的命令</b>。</p><p style="font-size:13px;opacity:.7">采集 · 制作 · 生火熬过黑夜 · 完成主人的命令</p><div class="go">开始游戏</div></div>
<script>
"use strict";
const ASSETS=__ASSETS__;
const IMG={}; let loaded=0; const keys=Object.keys(ASSETS);
for(const k of keys){ const im=new Image(); im.onload=()=>{loaded++;}; im.src=ASSETS[k]; IMG[k]=im; }
const cv=document.getElementById("cv"), cx=cv.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){ DPR=Math.min(2,devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; cx.setTransform(DPR,0,0,DPR,0,0); }
addEventListener("resize",resize); resize();

/* ---------------- random ---------------- */
function rng(s){ return ()=>{ s|=0; s=s+0x6D2B79F5|0; let t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const R=rng(20260927);

/* ---------------- camera (tilted, rotatable, Don't-Starve-like but sees the horizon) ---------------- */
const cam={yaw:0.35,yawT:0.35,pitch:0.30,dist:20,distT:20,tx:0,ty:0,F:1,C:[0,0,0],f:[0,0,0],r:[0,0,0],u:[0,0,0],cy:0};
function camUpdate(){
  const {yaw,pitch}=cam; const cp=Math.cos(pitch), sp=Math.sin(pitch);
  cam.f=[Math.sin(yaw)*cp, Math.cos(yaw)*cp, -sp];
  cam.r=[Math.cos(yaw), -Math.sin(yaw), 0];
  const r=cam.r,f=cam.f; cam.u=[r[1]*f[2]-r[2]*f[1], r[2]*f[0]-r[0]*f[2], r[0]*f[1]-r[1]*f[0]];
  cam.C=[cam.tx-f[0]*cam.dist, cam.ty-f[1]*cam.dist, -f[2]*cam.dist];
  cam.F=Math.min(W*0.9,H*1.25); cam.cy=H*0.47;
}
function proj(x,y,z){ const d0=x-cam.C[0], d1=y-cam.C[1], d2=z-cam.C[2]; const f=cam.f,r=cam.r,u=cam.u;
  const zc=d0*f[0]+d1*f[1]+d2*f[2]; if(zc<0.5) return null;
  const xc=d0*r[0]+d1*r[1]+d2*r[2], yc=d0*u[0]+d1*u[1]+d2*u[2];
  return {x:W/2+cam.F*xc/zc, y:cam.cy-cam.F*yc/zc, s:cam.F/zc, z:zc}; }
function unproj(sx,sy){ const a=(sx-W/2)/cam.F, b=-(sy-cam.cy)/cam.F; const f=cam.f,r=cam.r,u=cam.u;
  const d=[f[0]+r[0]*a+u[0]*b, f[1]+r[1]*a+u[1]*b, f[2]+r[2]*a+u[2]*b]; if(d[2]>=-1e-4) return null;
  const t=-cam.C[2]/d[2]; return [cam.C[0]+d[0]*t, cam.C[1]+d[1]*t]; }
function horizonY(){ return cam.cy-cam.F*Math.tan(cam.pitch); }

/* ---------------- paper texture ---------------- */
const paper=(()=>{ const c=document.createElement("canvas"); c.width=c.height=512; const g=c.getContext("2d"); const r=rng(7);
  const id=g.createImageData(512,512); for(let i=0;i<id.data.length;i+=4){ const v=225+r()*30; id.data[i]=v; id.data[i+1]=v-3; id.data[i+2]=v-10; id.data[i+3]=255; } g.putImageData(id,0,0);
  g.globalAlpha=0.06; g.strokeStyle="#6a5a40"; for(let i=0;i<500;i++){ g.lineWidth=r()*0.8; g.beginPath(); const x=r()*512,y=r()*512,a=r()*6.3,l=4+r()*18; g.moveTo(x,y); g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l); g.stroke(); }
  return c; })();
let paperPat=null;

/* ---------------- world ---------------- */
const WORLD=46; // half size
const RIVER={y0:17,y1:23}; // band along x: water between y0..y1 (north of it = far bank)
const PROPS={pine:[0,7.5,0.7],dead:[1,6,0.5],round:[2,6.5,0.8],boulder:[3,3.0,1.35],rocks:[4,1.7,0.9],grass:[5,0.9,0],bush:[6,1.5,0.6],sign:[7,2.3,0.3],stump:[8,1.4,0.6],mound:[9,1.3,0],fence:[10,1.7,0.3],mush:[11,1.1,0]};
const ents=[]; // {kind,x,y,h,rad,img,flip,...}
function addProp(kind,x,y,sc=1,extra={}){ const p=PROPS[kind]; const e=Object.assign({t:"prop",kind,x,y,h:p[1]*sc,rad:p[2]*sc,img:"prop_"+p[0],flip:R()<0.5,alpha:1},extra); ents.push(e); return e; }
function freeAt(x,y,r){ if(y>RIVER.y0-2.5&&y<RIVER.y1+2.5) return false; if(Math.hypot(x,y)<6) return false; for(const e of ents){ if(Math.hypot(e.x-x,e.y-y)<r+(e.rad||0.5)+0.6) return false; } return true; }
// path points (winding road from spawn towards the river & the windmill direction)
const PATH=[]; for(let i=0;i<=40;i++){ const t=i/40; PATH.push([Math.sin(t*5.2)*6-2+t*4, -WORLD+4+t*(WORLD*2-8)]); }
function nearPath(x,y,d){ for(const p of PATH) if(Math.hypot(p[0]-x,p[1]-y)<d) return true; return false; }
// puzzle 1: dog digs the X mound (west)
const MOUND=addProp("mound",-19,-6,1.3,{puzzle:"dig",dug:0});
addProp("sign",-15.5,-3.5,1,{say:"西边：松软的土。\n好像有什么东西埋着……"});
// puzzle 2: boulder ring (east) — unicorn breaks them
const RING=[]; { const cxr=20, cyr=-8; for(let i=0;i<7;i++){ const a=i/7*Math.PI*2+0.2; RING.push(addProp("boulder",cxr+Math.cos(a)*3.3,cyr+Math.sin(a)*3.3,0.95+R()*0.2,{puzzle:"smash",hp:1})); } }
addProp("sign",14.5,-2.5,1,{say:"东边：石阵。\n只有很硬的角才撞得开。"});
// puzzle 3: star across the river (north)
addProp("sign",3.5,RIVER.y0-3.2,1,{say:"河太深了，走不过去。\n要是能飞就好了……"});
// scatter
{ const r=rng(99); let n=0, tries=0; while(n<230&&tries<6000){ tries++; const x=(r()*2-1)*WORLD, y=(r()*2-1)*WORLD; const k=r();
    const kind=k<0.18?"pine":k<0.26?"dead":k<0.36?"round":k<0.44?"rocks":k<0.66?"grass":k<0.75?"bush":k<0.81?"stump":k<0.9?"mush":k<0.93?"boulder":"grass";
    const rad=(PROPS[kind][2]||0.4); if(nearPath(x,y,2.2+rad)) continue; if(Math.hypot(x-20,y+8)<6.5||Math.hypot(x+19,y+6)<4.5) continue; if(!freeAt(x,y,rad)) continue;
    addProp(kind,x,y,0.8+r()*0.45); n++; }
  // forest edge far north & fence near spawn
  for(let i=0;i<5;i++) addProp("fence",-6+i*1.9+ (i>2?6:0),-9.5,1);
}
// ground scribbles (grass strokes, pebbles) – flat marks
const MARKS=[]; { const r=rng(5); for(let i=0;i<1700;i++){ const x=(r()*2-1)*WORLD*1.3, y=(r()*2-1)*WORLD*1.3; if(y>RIVER.y0-0.3&&y<RIVER.y1+0.3) continue; MARKS.push({x,y,k:r()<0.75?0:1,a:r()*6.28,l:0.25+r()*0.35,n:1+Math.floor(r()*3)}); } }
// stars
const STARS=[
  {x:MOUND.x,y:MOUND.y,hidden:true,got:false,src:"dig"},
  {x:20,y:-8,hidden:false,got:false,src:"ring"},
  {x:4,y:RIVER.y1+7,hidden:false,got:false,src:"river"},
];

/* ---------------- characters ---------------- */
const SHEETS={ // side view facing direction in the sheet art (+1 = faces screen-right)
  heroine:{chibi:"heroine_A_chibi",normal:"heroine_A",sideDir:1,h:{chibi:2.3,normal:3.3}},
  demonD:{chibi:"demon_D_chibi",normal:"demon_D_normal",sideDir:-1,h:{chibi:2.4,normal:3.6}},
  demonD4:{chibi:"demon_D4_chibi",normal:"demon_D4_tall",sideDir:-1,h:{chibi:2.4,normal:3.7}},
};
const FORMS={
  human:{name:"人形",key:"1",speed:6.2},
  dog:{name:"狗",key:"2",speed:9.5,front:"animal_0",side:"animal_1",sideDir:-1,h:1.6},
  unicorn:{name:"独角兽",key:"3",speed:8.5,front:"animal_2",side:"animal_3",sideDir:-1,h:2.6},
  bird:{name:"鸟",key:"4",speed:10.5,front:"animal_5",side:"animal_4",sideDir:1,h:1.9,fly:2.6},
};
let PROP_MODE="chibi", DEMON="demonD4";
const hero={x:0,y:-2,z:0,face:0,form:"human",moving:0,bob:0,tf:null,dash:0,dig:0,vx:0,vy:0};
const demon={x:-2.2,y:-4,face:0,moving:0,bob:0,idle:0};
let target=null; // click-to-move

/* sheet view index from facing vs camera */
function viewOf(face,sideDir){ // face = world angle character faces (radians, 0 = +y)
  let rel=face-cam.yaw; rel=Math.atan2(Math.sin(rel),Math.cos(rel)); // 0 = facing away from camera (same dir as camera looks)
  const a=Math.abs(rel); const toRight = rel>0; // turning to camera-right
  let idx; if(a<Math.PI*0.125) idx=4; else if(a<Math.PI*0.375) idx=3; else if(a<Math.PI*0.625) idx=2; else if(a<Math.PI*0.875) idx=1; else idx=0;
  const wantDir = toRight?1:-1; const flip = (idx===0||idx===4)?false : (wantDir!==sideDir);
  return {idx,flip,rel};
}

/* ---------------- audio (tiny procedural paper sounds) ---------------- */
let AC=null; function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return AC; }
function paperSnd(len=0.35,freq=2400,vol=0.25){ const a=ac(); if(!a)return; const n=Math.floor(a.sampleRate*len), b=a.createBuffer(1,n,a.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++){ const t=i/n; d[i]=(Math.random()*2-1)*Math.pow(1-t,2)*(Math.random()<0.25?1:0.35); }
  const s=a.createBufferSource(); s.buffer=b; const f=a.createBiquadFilter(); f.type="bandpass"; f.frequency.value=freq; f.Q.value=0.8; const g=a.createGain(); g.gain.value=vol; s.connect(f).connect(g).connect(a.destination); s.start(); }
function chime(){ const a=ac(); if(!a)return; [880,1320,1760].forEach((fq,i)=>{ const o=a.createOscillator(), g=a.createGain(); o.type="triangle"; o.frequency.value=fq; g.gain.setValueAtTime(0,a.currentTime+i*0.09); g.gain.linearRampToValueAtTime(0.12,a.currentTime+i*0.09+0.02); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+i*0.09+0.8); o.connect(g).connect(a.destination); o.start(a.currentTime+i*0.09); o.stop(a.currentTime+i*0.09+0.9); }); }
function thud(){ const a=ac(); if(!a)return; const o=a.createOscillator(), g=a.createGain(); o.frequency.setValueAtTime(120,a.currentTime); o.frequency.exponentialRampToValueAtTime(40,a.currentTime+0.25); g.gain.setValueAtTime(0.4,a.currentTime); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.3); o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime+0.32); paperSnd(0.25,700,0.3); }

/* ---------------- speech bubbles ---------------- */
const bubbles=[]; function say(who,text,dur=3){ for(let i=bubbles.length-1;i>=0;i--) if(bubbles[i].who===who) bubbles.splice(i,1); bubbles.push({who,text,t:0,dur}); }
const DEMON_IDLE=["……（翻书）","嗯？还站在这里做什么。","我没叫你，别过来。","你的价值，取决于你带回来的东西。","……乖乖的就好。","别让我说第二遍。","狗就该有狗的样子。去。","（轻笑）……真好使唤。"];
let tipTimer=0;

/* ---------------- particles ---------------- */
const parts=[];
function shards(x,y,z,n,spd=6,col="#f7f3ea"){ for(let i=0;i<n;i++){ const a=Math.random()*6.28, v=spd*(0.4+Math.random()); parts.push({x,y,z:z+Math.random()*1.2,vx:Math.cos(a)*v,vy:Math.sin(a)*v,vz:3+Math.random()*5,life:1,rot:Math.random()*6,vr:(Math.random()-0.5)*14,sz:0.18+Math.random()*0.25,kind:"shard",col}); } }
function dirt(x,y,n){ for(let i=0;i<n;i++){ const a=Math.random()*6.28, v=2+Math.random()*4; parts.push({x,y,z:0.2,vx:Math.cos(a)*v,vy:Math.sin(a)*v,vz:4+Math.random()*4,life:1,rot:0,vr:0,sz:0.08+Math.random()*0.1,kind:"dirt"}); } }
function sparkle(x,y,z){ for(let i=0;i<16;i++){ const a=i/16*6.28; parts.push({x,y,z,vx:Math.cos(a)*4,vy:Math.sin(a)*4,vz:2,life:1,rot:0,vr:0,sz:0.12,kind:"spark"}); } }

/* ---------------- input ---------------- */
const K={}; addEventListener("keydown",e=>{ K[e.code]=1; if(e.repeat)return;
  if(e.code==="KeyQ") rotCam(-1); if(e.code==="KeyE") rotCam(1);
  if(e.code==="Digit1") transform("human"); if(e.code==="Digit2") transform("dog"); if(e.code==="Digit3") transform("unicorn"); if(e.code==="Digit4") transform("bird");
  if(e.code==="Space"){ e.preventDefault(); action(); } if(e.code==="KeyP") toggleProp(); if(e.code==="KeyC") toggleDemon(); });
addEventListener("keyup",e=>{ K[e.code]=0; });
function rotCam(d){ cam.yawT+=d*Math.PI/4; }
let drag=null;
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerdown",e=>{ ac(); drag={x:e.clientX,y:e.clientY,btn:e.button,moved:0,yaw:cam.yawT}; cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove",e=>{ if(!drag)return; const dx=e.clientX-drag.x; if(Math.abs(dx)>6) drag.moved=1; if(drag.btn===2||(e.pointerType!=="mouse"&&drag.moved&&Math.abs(dx)>30)){ cam.yawT=drag.yaw-dx*0.006; } });
cv.addEventListener("pointerup",e=>{ if(drag&&!drag.moved&&drag.btn===0){ const g=unproj(e.clientX,e.clientY); if(g) target={x:g[0],y:g[1]}; } drag=null; });
cv.addEventListener("wheel",e=>{ cam.distT=Math.max(11,Math.min(34,cam.distT*(e.deltaY>0?1.1:0.9))); },{passive:true});
document.getElementById("act").onclick=()=>{ ac(); action(); };
document.getElementById("bRotL").onclick=()=>rotCam(-1);
document.getElementById("bRotR").onclick=()=>rotCam(1);
function toggleProp(){ PROP_MODE=PROP_MODE==="chibi"?"normal":"chibi"; document.getElementById("bProp").textContent="比例："+(PROP_MODE==="chibi"?"Q版":"正常"); }
function toggleDemon(){ DEMON=DEMON==="demonD4"?"demonD":"demonD4"; document.getElementById("bDemon").textContent="恶魔："+(DEMON==="demonD4"?"D4 冷淡":"D 原版（对比）"); say("demon","……看够了？去干活。",2.2); }
document.getElementById("bProp").onclick=toggleProp; document.getElementById("bDemon").onclick=toggleDemon;
// form buttons
{ const box=document.getElementById("forms"); for(const k of Object.keys(FORMS)){ const b=document.createElement("div"); b.className="fb"; b.id="f_"+k; const src=k==="human"?ASSETS.heroine_A_chibi_0:ASSETS[FORMS[k].front]; b.innerHTML=`<i>${FORMS[k].key}</i><img src="${src}"><span>${FORMS[k].name}</span>`; b.onclick=()=>{ac();transform(k);}; box.appendChild(b); } }
function updForms(){ for(const k of Object.keys(FORMS)) document.getElementById("f_"+k).classList.toggle("on",hero.form===k); }
updForms();

/* ---------------- transformation (origami fold -> unfold) ---------------- */
function inRiver(x,y){ return y>RIVER.y0&&y<RIVER.y1; }
function transform(to){ if(hero.tf||hero.form===to) return;
  if(hero.form==="bird"&&inRiver(hero.x,hero.y)&&to!=="bird"){ say("hero","在河上变回来会掉下去的！",2); return; }
  hero.tf={from:hero.form,to,t:0}; paperSnd(0.45,2600,0.28); setTimeout(()=>paperSnd(0.3,1800,0.25),300); setTimeout(()=>paperSnd(0.25,3200,0.3),520);
}
const TF_DUR=1.05;

/* ---------------- actions ---------------- */
function action(){ if(hero.tf) return; const f=hero.form;
  if(f==="dog"){ if(Math.hypot(hero.x-MOUND.x,hero.y-MOUND.y)<2.6&&!MOUND.dug){ hero.dig=1.4; say("hero","汪！汪！（刨刨刨）",1.4); } else { hero.dig=0.5; say("hero","汪？",1); } return; }
  if(f==="unicorn"){ if(hero.dash<=0){ hero.dash=0.45; paperSnd(0.3,900,0.3); } return; }
  if(f==="bird"){ say("hero",inRiver(hero.x,hero.y)?"飞呀飞～":"啾啾！",1.2); return; }
  // human: gather > talk/deliver to master > read signs
  const it=nearestInteract(); if(it){ gather(it); return; }
  if(Math.hypot(demon.x-hero.x,demon.y-hero.y)<3.2){ if(tryDeliver()) { say("hero","主人，请收下！",1.6); return; }
    say("hero",pick(["主人，有什么吩咐？","主人～","主人，我会努力的！"]),1.6); setTimeout(()=>say("demon",curCmd().t+(curCmd().need?"\n……还没弄齐就别来烦我。":""),3.4),900); return; }
  let best=null,bd=3; for(const e of ents){ if(e.say&&!e.gone){ const d=Math.hypot(e.x-hero.x,e.y-hero.y); if(d<bd){bd=d;best=e;} } }
  if(best){ say("sign",best.say,4); bubbles[bubbles.length-1].at=best; return; }
  if(S.equip!=="axe"&&ents.some(e=>e.chop&&!e.gone&&Math.hypot(e.x-hero.x,e.y-hero.y)<2.5)){ say("hero","要有斧头才能砍树……",1.4); return; }
  say("hero",pick(["嘿咻！","主人要的东西在哪里呢……","这里什么都没有～"]),1.4);
}
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

/* ---------------- collisions ---------------- */
function blocked(x,y,flying){ if(Math.abs(x)>WORLD-1||Math.abs(y)>WORLD-1) return true; if(!flying&&y>RIVER.y0-0.2&&y<RIVER.y1+0.2) return true;
  if(flying) return false;
  for(const e of ents){ if(e.rad>0&&!e.gone){ if(Math.hypot(e.x-x,e.y-y)<e.rad+0.45) return e; } } return false; }

/* ================= SURVIVAL (Don't Starve elements) ================= */
const ITEMS={
  berry:{n:"浆果",img:"item_0",food:[9,0,1]},
  grass:{n:"干草",img:"item_1",fuel:15},
  twig:{n:"树枝",img:"item_2",fuel:10},
  flint:{n:"燧石",img:"item_3"},
  stone:{n:"石头",img:"item_4"},
  log:{n:"木头",img:"item_5",fuel:35},
  torch:{n:"火把",img:"item_6",equip:"torch"},
  axe:{n:"斧头",img:"item_7",equip:"axe"},
  skewer:{n:"烤浆果",img:"item_9",food:[25,3,4]},
  mush:{n:"蘑菇",img:"item_10",food:[12,0,-8]},
  star:{n:"折纸星星",img:"item_11"},
};
const RECIPES=[
  {id:"torch",n:"火把",need:{grass:2,twig:2},desc:"照亮黑夜，可燃烧 80 秒"},
  {id:"axe",n:"斧头",need:{twig:1,flint:1},desc:"装备后对着树按 空格 砍树"},
  {id:"campfire",n:"营火",need:{grass:3,log:2},desc:"放在脚下。夜里没有光会被黑暗吞掉",place:true,img:"item_8"},
  {id:"skewer",n:"烤浆果",need:{berry:2},desc:"需要站在营火旁",fire:true},
];
const S={hp:100,hunger:120,san:90,day:1,clock:0.12,inv:[],equip:null,torchFuel:0,darkT:0,hurtT:0,cmd:0,cmdDone:0,starsGiven:0,dead:0,praise:0,flash:0};
const DAY_LEN=260; // seconds per full day
const fires=[]; // {x,y,fuel}
const gitems=[]; // ground items {x,y,id,n,z,vz}
const floats=[]; // floating texts
function invCount(id){ return S.inv.reduce((a,s)=>a+(s&&s.id===id?s.n:0),0); }
function invAdd(id,n=1){ for(const s of S.inv){ if(s&&s.id===id&&s.n<40){ const k=Math.min(n,40-s.n); s.n+=k; n-=k; if(!n)break; } }
  while(n>0){ let i=S.inv.findIndex(s=>!s); if(i<0){ if(S.inv.length<10){ S.inv.push(null); i=S.inv.length-1; } else break; } const k=Math.min(n,40); S.inv[i]={id,n:k}; n-=k; }
  if(n>0) drop(hero.x,hero.y,id,n); buildInv(); }
function invTake(id,n){ for(let i=S.inv.length-1;i>=0&&n>0;i--){ const s=S.inv[i]; if(s&&s.id===id){ const k=Math.min(n,s.n); s.n-=k; n-=k; if(!s.n){ S.inv[i]=null; if(S.equip===id&&!invCount(id)) S.equip=null; } } } buildInv(); }
function has(need){ return Object.entries(need).every(([k,v])=>invCount(k)>=v); }
function drop(x,y,id,n=1,pop=true){ gitems.push({x:x+(Math.random()-0.5)*0.8,y:y+(Math.random()-0.5)*0.8,id,n,z:pop?0.8:0,vz:pop?4:0}); }
function floatTxt(x,y,t){ floats.push({x,y,z:2.4,t:0,text:t}); }
function nearFire(r=4.5){ return fires.some(f=>f.fuel>0&&Math.hypot(f.x-hero.x,f.y-hero.y)<r); }
function craft(rc){ if(hero.form!=="human"){ say("hero","变回人形才能用手做东西……",1.6); return; }
  if(!has(rc.need)){ say("hero","材料不够……",1.2); return; }
  if(rc.fire&&!nearFire()){ say("hero","要在营火旁边才行。",1.6); return; }
  for(const [k,v] of Object.entries(rc.need)) invTake(k,v); paperSnd(0.3,2000,0.25);
  if(rc.id==="campfire"){ fires.push({x:hero.x+Math.sin(hero.face)*1.4,y:hero.y+Math.cos(hero.face)*1.4,fuel:90,max:120,mine:1}); floatTxt(hero.x,hero.y,"+ 营火"); onCommandEvent("fire"); }
  else { invAdd(rc.id,1); floatTxt(hero.x,hero.y,"+1 "+ITEMS[rc.id].n); if(rc.id==="torch"&&!S.equip){ equip("torch"); } }
  buildCraft(); }
function equip(id){ if(S.equip===id){ S.equip=null; } else { S.equip=id; if(id==="torch"&&S.torchFuel<=0){ S.torchFuel=80; } } buildInv(); }
function useSlot(i){ const s=S.inv[i]; if(!s) return; const it=ITEMS[s.id];
  if(it.food){ if(hero.form!=="human"&&hero.form!=="dog"){ say("hero","这个样子吃不了……",1.2); return; } S.hunger=Math.min(150,S.hunger+it.food[0]); S.hp=Math.min(100,S.hp+it.food[1]); S.san=Math.max(0,Math.min(100,S.san+it.food[2])); invTake(s.id,1); floatTxt(hero.x,hero.y,"+"+it.food[0]+" 饱食"); paperSnd(0.2,900,0.2); if(s.id==="mush") say("hero","呜……头有点晕……",1.6); return; }
  if(it.equip){ if(hero.form!=="human"){ say("hero","要人形才能拿东西。",1.2); return; } equip(s.id); return; }
  // fuel into a fire
  if(it.fuel&&nearFire(3.2)){ const f=fires.filter(f=>f.fuel>0).sort((a,b)=>Math.hypot(a.x-hero.x,a.y-hero.y)-Math.hypot(b.x-hero.x,b.y-hero.y))[0]; f.fuel=Math.min(f.max,f.fuel+it.fuel); invTake(s.id,1); floatTxt(f.x,f.y,"火焰 +"+it.fuel); return; }
  say("hero",it.n+"……现在用不上。",1.2); }

/* ---- demon's commands (the "contract") ---- */
const CMDS=[
  {t:"去摘 4 个浆果献给我。",need:{berry:4},praise:"……嗯。乖。"},
  {t:"天黑之前，生一堆火。\n不是为你——我讨厌看不清书。",ev:"fire",praise:"勉强能看书了。……做得不坏。"},
  {t:"那三颗折纸星星，全部找来献给我。",need:{star:3},praise:"三颗都齐了。很好——\n你果然是条好用的狗。",big:1},
];
const CMD_POOL=[
  {t:"给我带 3 块木头来。",need:{log:3},praise:"嗯。放那儿。"},
  {t:"我要 2 块燧石。快点。",need:{flint:2},praise:"……还算快。"},
  {t:"去采 2 个蘑菇。别自己偷吃。",need:{mush:2},praise:"没偷吃？……很好。"},
  {t:"6 束干草。现在。",need:{grass:6},praise:"乖。"},
  {t:"去弄 2 块石头来。",need:{stone:2},praise:"嗯，好狗。"},
];
function curCmd(){ return S.cmd<CMDS.length?CMDS[S.cmd]:CMD_POOL[(S.cmd-CMDS.length+S.day)%CMD_POOL.length]; }
function cmdText(){ const c=curCmd(); let t=c.t.replace("\n"," "); if(c.need) t+="  （"+Object.entries(c.need).map(([k,v])=>ITEMS[k].n+" "+Math.min(invCount(k),v)+"/"+v).join("，")+"）"; return t; }
function completeCmd(){ const c=curCmd(); S.cmd++; S.cmdDone++; S.san=Math.min(100,S.san+18); S.praise=2.5;
  say("demon",c.praise,3.2); setTimeout(()=>say("hero",pick(["主人夸我了……！","是！为了主人！","嘿嘿……主人……"]),2),1800);
  if(c.big){ won=true; winT=0; }
  setTimeout(()=>{ say("demon",curCmd().t,3.6); updCmd(); },5200); updCmd(); chime(); }
function onCommandEvent(ev){ const c=curCmd(); if(c.ev===ev) completeCmd(); }
function tryDeliver(){ const c=curCmd(); if(!c.need) return false; if(!has(c.need)){ return false; } for(const [k,v] of Object.entries(c.need)) invTake(k,v); if(c.need.star) S.starsGiven=3; completeCmd(); return true; }
function updCmd(){ const el=document.getElementById("cmd"); if(el) el.innerHTML="<b>主人的命令</b><br>"+cmdText(); }

/* ---- UI: inventory + crafting ---- */
function buildInv(){ const box=document.getElementById("inv"); if(!box) return; while(S.inv.length<10) S.inv.push(null); box.innerHTML="";
  S.inv.forEach((s,i)=>{ const d=document.createElement("div"); d.className="slot"+(s&&S.equip===s.id?" eq":""); d.innerHTML=`<i>${(i+1)%10}</i>`+(s?`<img src="${ASSETS[ITEMS[s.id].img]}"><span>${s.n>1?s.n:""}</span>`:"");
    if(s) d.title=ITEMS[s.id].n+(ITEMS[s.id].food?"（点击吃掉）":ITEMS[s.id].equip?"（点击装备）":ITEMS[s.id].fuel?"（营火旁点击添柴）":"");
    d.onclick=()=>{ ac(); useSlot(i); }; box.appendChild(d); });
  updCmd(); buildCraft(); }
function buildCraft(){ const box=document.getElementById("craft"); if(!box) return; box.innerHTML="<b>制作</b>";
  for(const rc of RECIPES){ const ok=has(rc.need)&&(!rc.fire||nearFire()); const d=document.createElement("div"); d.className="rc"+(ok?" ok":"");
    d.innerHTML=`<img src="${ASSETS[rc.img||ITEMS[rc.id].img]}"><div><div class="rn">${rc.n}</div><div class="rq">${Object.entries(rc.need).map(([k,v])=>ITEMS[k].n+" "+invCount(k)+"/"+v).join(" · ")}</div><div class="rd">${rc.desc}</div></div>`;
    d.onclick=()=>{ ac(); craft(rc); }; box.appendChild(d); } }

/* ---- world resources ---- */
function setupResources(){
  for(const e of ents){ if(e.kind==="bush"){ e.res="berry"; e.ready=1; } else if(e.kind==="grass"){ e.res="grass"; e.ready=1; } else if(e.kind==="mush"){ e.res="mush"; e.ready=1; } else if(e.kind==="pine"||e.kind==="round"){ e.chop=3; } }
  const r=rng(321); for(let i=0;i<70;i++){ const x=(r()*2-1)*WORLD*0.9, y=(r()*2-1)*WORLD*0.9; if(y>RIVER.y0-1&&y<RIVER.y1+1) continue; gitems.push({x,y,id:r()<0.65?"twig":"flint",n:1,z:0,vz:0}); }
  // a few near the start so the first night is survivable
  [["twig",2,-1],["twig",-2,1],["flint",1.5,2.5],["twig",3,-3],["grass",-3,-2]].forEach(([id,x,y])=>gitems.push({x,y,id,n:1,z:0,vz:0}));
}
function nearestInteract(){ let best=null,bd=2.4;
  for(const g of gitems){ const d=Math.hypot(g.x-hero.x,g.y-hero.y); if(d<bd){bd=d;best={k:"item",o:g};} }
  for(const e of ents){ if(e.gone) continue; const d=Math.hypot(e.x-hero.x,e.y-hero.y)-(e.rad||0);
    if(e.res&&e.ready&&d<bd){ bd=d; best={k:"res",o:e}; }
    else if(e.chop&&S.equip==="axe"&&d<bd+0.4){ bd=d; best={k:"chop",o:e}; } }
  return best; }
function gather(it){ const o=it.o;
  if(it.k==="item"){ gitems.splice(gitems.indexOf(o),1); invAdd(o.id,o.n); floatTxt(o.x,o.y,"+"+o.n+" "+ITEMS[o.id].n); paperSnd(0.15,3000,0.15); return; }
  if(it.k==="res"){ o.ready=0; o.regrow=o.res==="mush"?120:o.res==="berry"?90:60; const n=o.res==="berry"?2:1; invAdd(o.res,n); floatTxt(o.x,o.y,"+"+n+" "+ITEMS[o.res].n); paperSnd(0.2,2400,0.2); if(o.res==="mush") o.gone=true, o.respawn=150; return; }
  if(it.k==="chop"){ o.chop--; o.shake=0.3; thud(); shards(o.x,o.y,1.2,5,3,"#e8dfcc");
    if(o.chop<=0){ o.gone=true; const st=addProp("stump",o.x,o.y,1); st.alpha=1; drop(o.x,o.y,"log",1); drop(o.x,o.y,"log",1); if(Math.random()<0.5) drop(o.x,o.y,"twig",1); say("hero","倒啦！",1); } }
}

/* ---- per-frame survival tick ---- */
function darkness(){ const c=S.clock; if(c<0.55) return 0; if(c<0.7) return (c-0.55)/0.15*0.55; if(c<0.93) return 0.55+Math.min(1,(c-0.7)/0.05)*0.4; return 0.95*(1-(c-0.93)/0.07); }
function phaseName(){ const c=S.clock; return c<0.55?"白天":c<0.7?"黄昏":c<0.93?"夜晚":"黎明"; }
function lightAt(x,y){ let best=0; for(const f of fires){ if(f.fuel<=0) continue; const r=fireR(f); const d=Math.hypot(f.x-x,f.y-y); best=Math.max(best,1-d/r); }
  if(S.equip==="torch"&&S.torchFuel>0&&hero.form==="human"){ best=Math.max(best,1-Math.hypot(hero.x-x,hero.y-y)/5); } return best; }
function fireR(f){ return 2.5+Math.min(5.5,f.fuel/16); }
let lastPhase="";
function survivalStep(dt){
  S.clock+=dt/DAY_LEN; if(S.clock>=1){ S.clock-=1; S.day++; say("hero","第 "+S.day+" 天……天亮了！",2); }
  const ph=phaseName(); if(ph!==lastPhase){ if(ph==="黄昏"){ say("demon",fires.some(f=>f.fuel>0)?"……天要黑了。":"天要黑了。\n没火的话，你会被黑暗里的东西吃掉。\n……与我无关。",3.6); } if(ph==="夜晚"&&!fires.some(f=>f.fuel>0)&&!(S.equip==="torch")) say("hero","好黑……主人……？",2); lastPhase=ph; }
  // hunger & health
  S.hunger=Math.max(0,S.hunger-dt*0.42); if(S.hunger<=0){ S.hp-=dt*1.2; if(Math.random()<dt*0.2) say("hero","肚子……好饿……",1.4); }
  // sanity: drains at dusk/night away from light; restored slowly near fire
  const dk=darkness(), lit=lightAt(hero.x,hero.y);
  if(dk>0.3&&lit<0.1) S.san-=dt*0.55; else if(lit>0.2&&dk>0.3) S.san+=dt*0.15;
  if(Math.hypot(demon.x-hero.x,demon.y-hero.y)<3.5&&dk<0.3) S.san+=dt*0.05; // being near her master calms her (the contract)
  S.san=Math.max(0,Math.min(100,S.san));
  if(S.san<30&&Math.random()<dt*0.05){ say("hero",pick(["我……以前是谁……？","扫帚……我的扫帚是做什么用的……","……主人？"]),2); setTimeout(()=>say("demon",pick(["别想多余的事。","你是我的。仅此而已。","……看着我。"]),2.4),1600); setTimeout(()=>{S.san=Math.min(100,S.san+6);},2000); }
  if(S.san<15) S.hp-=dt*0.4;
  // darkness monster
  if(dk>0.85&&lit<0.05){ S.darkT+=dt; if(S.darkT>2.2){ S.hurtT-=dt; if(S.hurtT<=0){ S.hurtT=2; S.hp-=16; S.flash=0.6; shake=0.3; thud(); say("hero",pick(["呀啊！有东西在咬我！","好痛！火……要火……！"]),1.6); } } }
  else { S.darkT=0; S.hurtT=0.4; }
  // torch
  if(S.equip==="torch"&&hero.form==="human"){ S.torchFuel-=dt; if(S.torchFuel<=0){ invTake("torch",1); S.equip=null; S.torchFuel=0; say("hero","火把烧完了……",1.4); if(invCount("torch")) { S.torchFuel=80; S.equip="torch"; } buildInv(); } }
  // fires
  for(const f of fires){ if(f.fuel>0){ f.fuel-=dt; if(Math.random()<dt*6) parts.push({x:f.x+(Math.random()-0.5)*0.4,y:f.y+(Math.random()-0.5)*0.4,z:0.6,vx:(Math.random()-0.5)*0.4,vy:(Math.random()-0.5)*0.4,vz:2+Math.random()*1.5,life:1,rot:0,vr:0,sz:0.07,kind:"ember"}); } }
  // regrowth
  for(const e of ents){ if(e.regrow>0){ e.regrow-=dt; if(e.regrow<=0){ e.ready=1; } } if(e.respawn>0){ e.respawn-=dt; if(e.respawn<=0){ e.gone=false; e.ready=1; } } if(e.shake>0) e.shake-=dt; }
  // ground items physics
  for(const g of gitems){ if(g.vz||g.z>0){ g.z+=g.vz*dt; g.vz-=14*dt; if(g.z<=0){ g.z=0; g.vz=0; } } }
  for(let i=floats.length-1;i>=0;i--){ floats[i].t+=dt; if(floats[i].t>1.4) floats.splice(i,1); }
  if(S.praise>0) S.praise-=dt; if(S.flash>0) S.flash-=dt;
  // death
  if(S.hp<=0&&!S.dead){ S.dead=1; S.hp=0; say("hero","主……人……",2); setTimeout(()=>{ say("demon","……没用的东西。起来。\n我还没允许你倒下。",3.4); S.hp=50; S.hunger=Math.max(S.hunger,60); S.san=Math.max(S.san,40); hero.x=demon.x+1.2; hero.y=demon.y; S.dead=0; // lose half of each stack
      S.inv=S.inv.map(s=>s&&s.id!=="star"?(s.n>1?{id:s.id,n:Math.ceil(s.n/2)}:null):s); buildInv(); if(darkness()>0.5&&!fires.some(f=>f.fuel>0)) fires.push({x:demon.x-1,y:demon.y+1,fuel:60,max:120}); },2200); }
  S._t=(S._t||0)+dt; if(S._t>0.5){ S._t=0; buildCraftLite(); }
}
let _craftKey=""; function buildCraftLite(){ const k=RECIPES.map(rc=>has(rc.need)&&(!rc.fire||nearFire())?1:0).join("")+S.inv.map(s=>s?s.id+s.n:"_").join(); if(k!==_craftKey){ _craftKey=k; buildCraft(); updCmd(); } }

/* ---- drawing: ground items, fires, darkness, HUD ---- */
function drawGItem(g){ const p=proj(g.x,g.y,g.z); if(!p) return; const p0=proj(g.x,g.y,0); shadow(p0,0.25); sprite(IMG[ITEMS[g.id].img],p,0.55,false,1,1,1,Math.sin(g.x*3)*0.3); }
function drawFire(f){ const p=proj(f.x,f.y,0); if(!p) return; const lit=f.fuel>0; sprite(IMG.item_8,p,1.1,false,lit?1:0.7,1,lit?1+Math.sin(time*9)*0.04:0.5);
  if(lit){ const fl=Math.min(1,f.fuel/40); cx.save(); cx.globalCompositeOperation="lighter"; const g=cx.createRadialGradient(p.x,p.y-p.s*0.5,0,p.x,p.y-p.s*0.5,p.s*1.4*(0.7+fl*0.5)); g.addColorStop(0,"rgba(255,230,170,0.35)"); g.addColorStop(1,"rgba(255,200,120,0)"); cx.fillStyle=g; cx.beginPath(); cx.arc(p.x,p.y-p.s*0.5,p.s*1.6,0,6.3); cx.fill(); cx.restore(); } }
let darkC=null;
function drawDarkness(){ const dk=darkness(); if(dk<=0.01) return; if(!darkC){ darkC=document.createElement("canvas"); } if(darkC.width!==Math.ceil(W/2)){ darkC.width=Math.ceil(W/2); darkC.height=Math.ceil(H/2); }
  const g=darkC.getContext("2d"); g.setTransform(0.5,0,0,0.5,0,0); g.globalCompositeOperation="source-over"; g.clearRect(0,0,W,H); g.fillStyle=`rgba(14,12,18,${dk})`; g.fillRect(0,0,W,H);
  g.globalCompositeOperation="destination-out";
  const hole=(x,y,r,a)=>{ const p=proj(x,y,0.3); if(!p) return; const R=r*p.s; g.save(); g.translate(p.x,p.y-R*0.1); g.scale(1,0.62); const gr=g.createRadialGradient(0,0,R*0.15,0,0,R); gr.addColorStop(0,`rgba(0,0,0,${a})`); gr.addColorStop(0.6,`rgba(0,0,0,${a*0.75})`); gr.addColorStop(1,"rgba(0,0,0,0)"); g.fillStyle=gr; g.beginPath(); g.arc(0,0,R,0,6.3); g.fill(); g.restore(); };
  for(const f of fires) if(f.fuel>0) hole(f.x,f.y,fireR(f)*(1+Math.sin(time*11+f.x)*0.03),1);

/* origami transform: sprite -> flat paper sheet (creases) -> folds to a square -> sharp flaps burst open -> new form */
function drawTransform(p,tf){ const t=tf.t/TF_DUR; const base=p.s*1.9; const cyy=p.y-base*0.55;

function sheet(x,y,w,h,ang){ cx.save(); cx.translate(x,y); cx.rotate(Math.sin(ang)*0.5); const sk=Math.cos(ang*2)*0.3; cx.transform(1,sk*0.3,0,1,0,0);

function drawStar(s){ if(s.got||s.hidden) return; const pop=s.pop!==undefined?Math.min(1,s.pop):1; const z=1.2+Math.sin(time*2.4+s.x)*0.25; const p=proj(s.x,s.y,z*pop); const p0=proj(s.x,s.y,0); if(!p||!p0) return;

function drawBubbles(){ cx.font="15px "+getComputedStyle(document.body).fontFamily; cx.textAlign="center"; cx.textBaseline="middle";
