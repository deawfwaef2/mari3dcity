<div id="title"><h1>纸之魔女</h1><p>素描线稿 · 沙盒原型 v0.6</p><p style="font-size:15px;max-width:520px;text-align:center;line-height:1.9">她曾经是自由的魔女。<br>直到那天，她翻开了一本黑色的书。<br>……醒来时，她只记得一件事——<b>主人的命令</b>。</p><p style="font-size:13px;opacity:.7">探索纸之界 · 建造营地 · 收集献给主人 · 服从主人的命令</p><div class="go">开始游戏</div></div>
<script>
"use strict";
const ASSETS=__ASSETS__;
const IMG={}; let loaded=0; const keys=Object.keys(ASSETS);
for(const k of keys){ const im=new Image(); im.onload=()=>{loaded++;}; im.src=ASSETS[k]; IMG[k]=im; }
const cv=document.getElementById("cv"), cx=cv.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){ DPR=Math.min(2,devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; cx.setTransform(DPR,0,0,DPR,0,0); }
addEventListener("resize",resize); resize();

/* ---------------- random ---------------- */
function rng(s){ return ()=>{ s|=0; s=s+0x6D2B79F5|0; let t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const R=rng(20260927);

/* ---------------- camera (tilted, rotatable, Don't-Starve-like but sees the horizon) ---------------- */
const cam={yaw:0.35,yawT:0.35,pitch:0.30,dist:20,distT:20,tx:0,ty:0,F:1,C:[0,0,0],f:[0,0,0],r:[0,0,0],u:[0,0,0],cy:0};
function camUpdate(){
  const {yaw,pitch}=cam; const cp=Math.cos(pitch), sp=Math.sin(pitch);
  cam.f=[Math.sin(yaw)*cp, Math.cos(yaw)*cp, -sp];
  cam.r=[Math.cos(yaw), -Math.sin(yaw), 0];
  const r=cam.r,f=cam.f; cam.u=[r[1]*f[2]-r[2]*f[1], r[2]*f[0]-r[0]*f[2], r[0]*f[1]-r[1]*f[0]];
  cam.C=[cam.tx-f[0]*cam.dist, cam.ty-f[1]*cam.dist, -f[2]*cam.dist];
  cam.F=Math.min(W*0.9,H*1.25); cam.cy=H*0.47;
}
function proj(x,y,z){ const d0=x-cam.C[0], d1=y-cam.C[1], d2=z-cam.C[2]; const f=cam.f,r=cam.r,u=cam.u;
  const zc=d0*f[0]+d1*f[1]+d2*f[2]; if(zc<0.5) return null;
  const xc=d0*r[0]+d1*r[1]+d2*r[2], yc=d0*u[0]+d1*u[1]+d2*u[2];
  return {x:W/2+cam.F*xc/zc, y:cam.cy-cam.F*yc/zc, s:cam.F/zc, z:zc}; }
function unproj(sx,sy){ const a=(sx-W/2)/cam.F, b=-(sy-cam.cy)/cam.F; const f=cam.f,r=cam.r,u=cam.u;
  const d=[f[0]+r[0]*a+u[0]*b, f[1]+r[1]*a+u[1]*b, f[2]+r[2]*a+u[2]*b]; if(d[2]>=-1e-4) return null;
  const t=-cam.C[2]/d[2]; return [cam.C[0]+d[0]*t, cam.C[1]+d[1]*t]; }
function horizonY(){ return cam.cy-cam.F*Math.tan(cam.pitch); }

/* ---------------- paper texture ---------------- */
const paper=(()=>{ const c=document.createElement("canvas"); c.width=c.height=512; const g=c.getContext("2d"); const r=rng(7);
  const id=g.createImageData(512,512); for(let i=0;i<id.data.length;i+=4){ const v=225+r()*30; id.data[i]=v; id.data[i+1]=v-3; id.data[i+2]=v-10; id.data[i+3]=255; } g.putImageData(id,0,0);
  g.globalAlpha=0.06; g.strokeStyle="#6a5a40"; for(let i=0;i<500;i++){ g.lineWidth=r()*0.8; g.beginPath(); const x=r()*512,y=r()*512,a=r()*6.3,l=4+r()*18; g.moveTo(x,y); g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l); g.stroke(); }
  return c; })();
let paperPat=null;

/* ---------------- world ---------------- */
const WORLD=46; // half size
const RIVER={y0:17,y1:23}; // band along x: water between y0..y1 (north of it = far bank)
const PROPS={pine:[0,7.5,0.7],dead:[1,6,0.5],round:[2,6.5,0.8],boulder:[3,3.0,1.35],rocks:[4,1.7,0.9],grass:[5,0.9,0],bush:[6,1.5,0.6],sign:[7,2.3,0.3],stump:[8,1.4,0.6],mound:[9,1.3,0],fence:[10,1.7,0.3],mush:[11,1.1,0]};
const ents=[]; // {kind,x,y,h,rad,img,flip,...}
function addProp(kind,x,y,sc=1,extra={}){ const p=PROPS[kind]; const e=Object.assign({t:"prop",kind,x,y,h:p[1]*sc,rad:p[2]*sc,img:"prop_"+p[0],flip:R()<0.5,alpha:1},extra); ents.push(e); return e; }
function freeAt(x,y,r){ if(y>RIVER.y0-2.5&&y<RIVER.y1+2.5) return false; if(Math.hypot(x,y)<6) return false; for(const e of ents){ if(Math.hypot(e.x-x,e.y-y)<r+(e.rad||0.5)+0.6) return false; } return true; }
// path points (winding road from spawn towards the river & the windmill direction)
const PATH=[]; for(let i=0;i<=40;i++){ const t=i/40; PATH.push([Math.sin(t*5.2)*6-2+t*4, -WORLD+4+t*(WORLD*2-8)]); }
function nearPath(x,y,d){ for(const p of PATH) if(Math.hypot(p[0]-x,p[1]-y)<d) return true; return false; }
// puzzle 1: dog digs the X mound (west)
const MOUND=addProp("mound",-19,-6,1.3,{puzzle:"dig",dug:0});
addProp("sign",-15.5,-3.5,1,{say:"西边：松软的土。\n好像有什么东西埋着……"});
// puzzle 2: boulder ring (east) — unicorn breaks them
const RING=[]; { const cxr=20, cyr=-8; for(let i=0;i<7;i++){ const a=i/7*Math.PI*2+0.2; RING.push(addProp("boulder",cxr+Math.cos(a)*3.3,cyr+Math.sin(a)*3.3,0.95+R()*0.2,{puzzle:"smash",hp:1})); } }
addProp("sign",14.5,-2.5,1,{say:"东边：石阵。\n只有很硬的角才撞得开。"});
// puzzle 3: star across the river (north)
addProp("sign",3.5,RIVER.y0-3.2,1,{say:"河太深了，走不过去。\n要是能飞就好了……"});
// scatter
{ const r=rng(99); let n=0, tries=0; while(n<230&&tries<6000){ tries++; const x=(r()*2-1)*WORLD, y=(r()*2-1)*WORLD; const k=r();
    const kind=k<0.18?"pine":k<0.26?"dead":k<0.36?"round":k<0.44?"rocks":k<0.66?"grass":k<0.75?"bush":k<0.81?"stump":k<0.9?"mush":k<0.93?"boulder":"grass";
    const rad=(PROPS[kind][2]||0.4); if(nearPath(x,y,2.2+rad)) continue; if(Math.hypot(x-20,y+8)<6.5||Math.hypot(x+19,y+6)<4.5) continue; if(!freeAt(x,y,rad)) continue;
    addProp(kind,x,y,0.8+r()*0.45); n++; }
  // forest edge far north & fence near spawn
  for(let i=0;i<5;i++) addProp("fence",-6+i*1.9+ (i>2?6:0),-9.5,1);
}
// ground scribbles (grass strokes, pebbles) – flat marks
const MARKS=[]; { const r=rng(5); for(let i=0;i<1700;i++){ const x=(r()*2-1)*WORLD*1.3, y=(r()*2-1)*WORLD*1.3; if(y>RIVER.y0-0.3&&y<RIVER.y1+0.3) continue; MARKS.push({x,y,k:r()<0.75?0:1,a:r()*6.28,l:0.25+r()*0.35,n:1+Math.floor(r()*3)}); } }
// stars
const STARS=[
  {x:MOUND.x,y:MOUND.y,hidden:true,got:false,src:"dig"},
  {x:20,y:-8,hidden:false,got:false,src:"ring"},
  {x:4,y:RIVER.y1+7,hidden:false,got:false,src:"river"},
];

/* ---------------- characters ---------------- */
const SHEETS={ // side view facing direction in the sheet art (+1 = faces screen-right)
  heroine:{chibi:"heroine_A_chibi",normal:"heroine_A_chibi",sideDir:1,h:{chibi:2.3,normal:3.3}},
  demonD5:{chibi:"demon_D5_chibi",normal:"demon_D5_chibi",sideDir:-1,h:{chibi:2.45,normal:2.45}},
  demonD6:{chibi:"demon_D6_chibi",normal:"demon_D6_chibi",sideDir:-1,h:{chibi:2.45,normal:2.45}},
  demonD4:{chibi:"demon_D4_chibi",normal:"demon_D4_chibi",sideDir:-1,h:{chibi:2.4,normal:2.4}},
};
const FORMS={
  human:{name:"人形",key:"1",speed:6.2},
  dog:{name:"狗",key:"2",speed:9.5,front:"animal_0",side:"animal_1",sideDir:-1,h:1.6},
  unicorn:{name:"独角兽",key:"3",speed:8.5,front:"animal_2",side:"animal_3",sideDir:-1,h:2.6},
  bird:{name:"鸟",key:"4",speed:10.5,front:"animal_5",side:"animal_4",sideDir:1,h:1.9,fly:2.6},
};
let PROP_MODE="chibi", DEMON="demonD6";
const hero={x:0,y:-2,z:0,face:0,form:"human",moving:0,bob:0,tf:null,dash:0,dig:0,vx:0,vy:0};
const demon={x:-1.4,y:-8,face:0,moving:0,bob:0,idle:0,st:"read",t:0};
let target=null; // click-to-move

/* sheet view index from facing vs camera */
function viewOf(face,sideDir){ // face = world angle character faces (radians, 0 = +y)
  let rel=face-cam.yaw; rel=Math.atan2(Math.sin(rel),Math.cos(rel)); // 0 = facing away from camera (same dir as camera looks)
  const a=Math.abs(rel); const toRight = rel>0; // turning to camera-right
  let idx; if(a<Math.PI*0.125) idx=4; else if(a<Math.PI*0.375) idx=3; else if(a<Math.PI*0.625) idx=2; else if(a<Math.PI*0.875) idx=1; else idx=0;
  const wantDir = toRight?1:-1; const flip = (idx===0||idx===4)?false : (wantDir!==sideDir);
  return {idx,flip,rel};
}

/* ---------------- audio (tiny procedural paper sounds) ---------------- */
let AC=null; function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return AC; }
function paperSnd(len=0.35,freq=2400,vol=0.25){ const a=ac(); if(!a)return; const n=Math.floor(a.sampleRate*len), b=a.createBuffer(1,n,a.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++){ const t=i/n; d[i]=(Math.random()*2-1)*Math.pow(1-t,2)*(Math.random()<0.25?1:0.35); }
  const s=a.createBufferSource(); s.buffer=b; const f=a.createBiquadFilter(); f.type="bandpass"; f.frequency.value=freq; f.Q.value=0.8; const g=a.createGain(); g.gain.value=vol; s.connect(f).connect(g).connect(a.destination); s.start(); }
function chime(){ const a=ac(); if(!a)return; [880,1320,1760].forEach((fq,i)=>{ const o=a.createOscillator(), g=a.createGain(); o.type="triangle"; o.frequency.value=fq; g.gain.setValueAtTime(0,a.currentTime+i*0.09); g.gain.linearRampToValueAtTime(0.12,a.currentTime+i*0.09+0.02); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+i*0.09+0.8); o.connect(g).connect(a.destination); o.start(a.currentTime+i*0.09); o.stop(a.currentTime+i*0.09+0.9); }); }
function thud(){ const a=ac(); if(!a)return; const o=a.createOscillator(), g=a.createGain(); o.frequency.setValueAtTime(120,a.currentTime); o.frequency.exponentialRampToValueAtTime(40,a.currentTime+0.25); g.gain.setValueAtTime(0.4,a.currentTime); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.3); o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime+0.32); paperSnd(0.25,700,0.3); }

  if(placing){ confirmPlace(); return; }

  if(f==="human"&&nb("cabinet",2.6)){ openCatalog(); return; }
  if(f==="dog"){ if(Math.hypot(hero.x-MOUND.x,hero.y-MOUND.y)<2.6&&!MOUND.dug){ hero.dig=1.4; hero.digAt=null; say("hero","汪！汪！（刨刨刨）",1.4); return; }

  const it=nearestInteract(); if(it){ gather(it); return; }
  let best=null,bd=3; for(const e of ents){ if(e.say&&!e.gone){ const d=Math.hypot(e.x-hero.x,e.y-hero.y); if(d<bd){bd=d;best=e;} } }

  say("hero",pick(["嘿咻！","主人要的东西在哪里呢……","这里什么都没有～"]),1.4);
}

function blocked(x,y,flying){ if(Math.abs(x)>WORLD-1||Math.abs(y)>WORLD-1) return true; if(!flying&&y>RIVER.y0-0.2&&y<RIVER.y1+0.2) return true;

function deliverAll(){ const list=[]; for(let i=0;i<S.inv.length;i++){ const s=S.inv[i]; if(s&&ITEMS[s.id].col){ list.push({id:s.id,n:s.n}); S.inv[i]=null; } }
  if(!list.length) return false; buildInv();
  const mult=0.6+S.obey/100; let tot=0; const rows=[]; const rank0=rankOf(S.favor)[1]; let pastN=0;
  for(const it of list){ const c=COL[it.id]; const isNew=!S.given[it.id]; S.given[it.id]=(S.given[it.id]||0)+it.n; let pts=Math.round(RPTS[c[3]]*it.n*mult*(isNew?2:1));

  S.deliveries++; const firstD=S.deliveries===1, secondD=S.deliveries===2; const gotStar=rows.some(r=>r.id==="star");
  showAppraisal(rows,tot,bonus); updCmd(); S.praise=2.5;
  if(S.starsGiven>=3&&!won){ won=true; winT=0; }
  const best=rows.reduce((a,b)=>COL[b.id][3]>COL[a.id][3]?b:a,rows[0]); const br=COL[best.id][3];

 };

  else if(id==="snail"){ const t=pick(ents.filter(e=>(e.kind==="rocks"||e.kind==="boulder")&&!e.gone&&!e.puzzle)); if(t){ const a=Math.random()*6.28; p=[t.x+Math.cos(a)*(t.rad+0.6),t.y+Math.sin(a)*(t.rad+0.6)]; } }

  for(const b of bugs) if(b.id==="snail"&&Math.hypot(b.x-e.x,b.y-e.y)<2.5){ b.x+=1.5; } }

function cmdPool(forTrain){ const d=Math.hypot(hero.x-demon.x,hero.y-demon.y); let p=Object.keys(CMDS).filter(k=>(!CMDS[k].dog||hasKey("collar"))&&!(k==="come"&&d<5)&&!(k==="fetch"&&(demon.y>RIVER.y0-4&&demon.y<RIVER.y1+4)));
  if(!forTrain) p=p.filter(k=>k!=="come"); if(inRiver(hero.x,hero.y)) p=["come"]; return p; }
function ring(){ const a=ac(); if(!a) return; for(let i=0;i<3;i++){ const o=a.createOscillator(), g=a.createGain(); o.type="sine"; o.frequency.value=2200+i*7; const t=a.currentTime+i*0.16; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.09,t+0.01); g.gain.exponentialRampToValueAtTime(0.001,t+0.35); o.connect(g).connect(a.destination); o.start(t); o.stop(t+0.4); } }
function freeSpot(cx0,cy0,r0,r1){ for(let k=0;k<40;k++){ const a=Math.random()*6.28, r=r0+Math.random()*(r1-r0); const x=cx0+Math.cos(a)*r, y=cy0+Math.sin(a)*r; if(!blocked(x,y,false)&&!inRiver(x,y)&&Math.abs(x)<WORLD-3&&Math.abs(y)<WORLD-3) return {x,y}; } return null; }

  if(k==="leave"){ const p=freeSpot(hero.x,hero.y,2.2,3.2)||{x:hero.x+2.5,y:hero.y}; gitems.push({x:p.x,y:p.y,id:"bait",n:1,z:0.8,vz:4,age:0}); }
  if(k==="spot"){ const p=freeSpot(demon.x,demon.y,5,8)||freeSpot(hero.x,hero.y,4,7); if(!p) return issueOrder("quiet",src); ord.mx=p.x; ord.my=p.y; }
  if(k==="come") ring();

function orderStep(dt){ const o=S.order;
  if(!o){ if(S.train){ S.train.gap-=dt; if(S.train.gap<=0) nextTrain(); return; }
    if(started&&!demon.hidden&&hasKey("collar")){ S.summonCD-=dt; if(S.summonCD<=0){ S.summonCD=150+Math.random()*70; if(demon.st!=="follow"&&Math.hypot(hero.x-demon.x,hero.y-demon.y)>6&&!inRiver(hero.x,hero.y)) issueOrder("come","summon"); } } return; }
  o.left-=dt; o.grace-=dt; const d=Math.hypot(hero.x-demon.x,hero.y-demon.y); let ok=false, fail=false;
  if(o.k==="come"){ if(d<2.9) ok=true; }
  else if(o.k==="sit"){ if(hero.form==="dog"&&!hero.tf&&hero.moving<0.05&&d<3.6){ o.hold+=dt; if(o.hold>=6) ok=true; } else if(o.hold>0.5){ fail=true; } else o.hold=0; }
  else if(o.k==="fetch"){ if(hero.carry&&d<2.9){ ok=true; hero.carry=0; } }
  else if(o.k==="bring"){ if(d<2.9&&invCount(o.item)>0){ invTake(o.item,1); ok=true; } }
  else if(o.k==="leave"){ if(o.broke) fail=true; else if(o.left<=0) ok=true; }
  else if(o.k==="spot"){ if(Math.hypot(hero.x-o.mx,hero.y-o.my)<1.3&&hero.z<1){ o.hold+=dt; if(o.hold>=5) ok=true; } else o.hold=Math.max(0,o.hold-dt*2); }
  else if(o.k==="spin"){ if(hero.form==="dog"&&!hero.tf){ let df=hero.face-o.prevF; df=Math.atan2(Math.sin(df),Math.cos(df)); if(Math.hypot(hero.x-o.x0,hero.y-o.y0)<4) o.ang+=df; else { o.x0=hero.x; o.y0=hero.y; o.ang=0; } if(Math.abs(o.ang)>=Math.PI*4-0.1) ok=true; } o.prevF=hero.face; }
  else if(o.k==="quiet"){ if(o.broke) fail=true; else if(o.left<=0) ok=true; }
  if(!ok&&o.left<=0) fail=true;
  if(ok||fail){ const fr=o.left/o.T; const fixed=o.k==="leave"||o.k==="quiet"||o.k==="sit"||o.k==="spot"; const sc=fail?0:fixed?3:fr>0.5?3:fr>0.2?2:1;
    const L=CMD_LINES[o.k]; let line=fail?pick(L.fail):(sc===1&&L.slow?pick(L.slow):pick(L.ok));
    if(o.src==="train"){ S.train.scores.push({k:o.k,t:o.t,sc}); }
    else { const dObey=fail?-6:sc>=2?4:2; S.obey=Math.max(0,Math.min(100,S.obey+dObey)); if(!fail) S.favor+=1; floatTxt(hero.x,hero.y,"服从度 "+(dObey>0?"+":"")+dObey); if(o.k==="come"&&!fail){ S.comeOK++; if(!hasKey("whistle")&&hasKey("collar")) setTimeout(()=>gainKey("whistle"),2600); } }
    say("demon",line,2.6); if(!fail) chime(); endOrder(); }
  updOrder(); }
function endOrder(){ const o=S.order; S.order=null; for(let i=gitems.length-1;i>=0;i--) if(gitems[i].id==="stick"||gitems[i].id==="bait") gitems.splice(i,1); hero.carry=0; if(S.train) S.train.gap=2.4; updOrder(); }
function startTraining(){ const pool=cmdPool(true).filter(k=>k!=="come").sort(()=>Math.random()-0.5); S.train={list:pool.slice(0,3),i:0,scores:[],gap:2.2}; S.trainDay=S.day; say("demon","……训练。三道命令。\n一次做不好，就一直练到做好。",2.8); }
function nextTrain(){ const T=S.train; if(T.i>=T.list.length){ finishTraining(); return; } issueOrder(T.list[T.i++],"train"); }
function finishTraining(){ const T=S.train; S.train=null; const tot=T.scores.reduce((a,b)=>a+b.sc,0); const gi=tot<=1?0:tot<=3?1:tot<=5?2:tot===6?3:tot<=8?4:5;
  S.obey=Math.max(0,Math.min(100,S.obey+(tot-4)*2)); S.favor+=tot; const el=document.getElementById("appr"); S.paused=1;
  let h="<div class='ah'>今日训练 · 评分</div><div class='al'>"; for(const r of T.scores) h+=`<div class='ar'><div><div class='an'>「${r.t}」</div><div class='ac'>${r.sc?["","勉强","还行","利落"][r.sc]:"失败"}</div></div><div class='pt'>${"●".repeat(r.sc)}${"○".repeat(3-r.sc)}</div></div>`;
  h+=`</div><div class='af'><div style='font-size:26px;letter-spacing:.2em'>「${GRADES[gi]}」</div>主人：「${GRADE_LINE[gi].replace(/\n/g,"<br>")}」<br><small>服从度 ${(tot-4)*2>=0?"+":""}${(tot-4)*2} · 满意度 +${tot}</small></div><div class='ab' onclick='closeAppraisal()'>是，主人（空格）</div>`;
  el.innerHTML=h; el.style.display="flex"; }
function updOrder(){ const el=document.getElementById("order"); if(!el) return; const o=S.order; if(!o){ el.style.display="none"; return; } el.style.display="block";
  let st=CMDS[o.k].st; if(CMDS[o.k].dog&&hero.form!=="dog") st="先变成狗 (2)";
  else if(o.k==="sit") st="一动不动 "+o.hold.toFixed(1)+"/6"; else if(o.k==="fetch"&&hero.carry) st="叼回主人身边！"; else if(o.k==="bring") st="袋里有 "+invCount(o.item)+" · 带到主人身边"; else if(o.k==="spot") st="站在圈里 "+o.hold.toFixed(1)+"/5"; else if(o.k==="spin") st="转圈 "+Math.min(100,Math.round(Math.abs(o.ang)/(Math.PI*4)*100))+"%"; else if(o.k==="come") st="铃铛响了 — "+st;
  const tr=o.src==="train"&&S.train?" <small>("+S.train.i+"/3)</small>":"";
  el.innerHTML=`<b>${o.src==="train"?"训练":"主人的命令"}</b>${tr} ${o.t}<br><small>${st}</small><div class='bar'><i style='width:${Math.max(0,o.left/o.T*100)}%'></i></div>`; }
function drawSpot(){ const o=S.order; if(!o||o.k!=="spot") return; const p=proj(o.mx,o.my,0); if(!p) return; cx.save(); cx.strokeStyle="#2a2622"; cx.lineWidth=2.5; cx.setLineDash([7,5]); cx.lineDashOffset=-time*20; cx.beginPath(); cx.ellipse(p.x,p.y,1.3*p.s,1.3*p.s*0.34,0,0,6.3); cx.stroke(); cx.setLineDash([]); cx.globalAlpha=Math.min(1,o.hold/5); cx.fillStyle="rgba(40,34,28,0.25)"; cx.beginPath(); cx.ellipse(p.x,p.y,1.3*p.s,1.3*p.s*0.34,0,0,6.3); cx.fill(); cx.restore(); }

/* ---- per-frame tick ---- */
function darkness(){ const c=S.clock; if(c<0.55) return 0; if(c<0.66) return (c-0.55)/0.11*0.45; if(c<0.93) return 0.45; return 0.45*(1-(c-0.93)/0.07); }
function phaseName(){ const c=S.clock; return c<0.55?"白天":c<0.66?"黄昏":c<0.93?"夜晚":"黎明"; }
let lastPhase="";
function colStep(dt){
  S.clock+=dt/DAY_LEN; if(S.clock>=1){ S.clock-=1; S.day++; genQuota(); note("第 "+S.day+" 天 · 新的献礼单"); }
  const ph=phaseName(); if(ph!==lastPhase){ lastPhase=ph; }
  if(S.fishCD>0) S.fishCD-=dt; if(S.sniffT>0) S.sniffT-=dt;
  for(const d of digs) if(d.rev>0) d.rev-=dt;
  for(const e of ents){ if(e.regrow>0){ e.regrow-=dt; if(e.regrow<=0) e.ready=1; } if(e.respawn>0){ e.respawn-=dt; if(e.respawn<=0){ e.gone=false; e.ready=1; } } if(e.shake>0) e.shake-=dt; if(e.nest&&e.nest.cd>0) e.nest.cd-=dt; }
  // bugs
  for(const b of bugs){ b.ph+=dt; const fly=b.id!=="beetle"&&b.id!=="snail"; const dh=Math.hypot(hero.x-b.x,hero.y-b.y);
    if(b.flee>0){ b.flee-=dt; const a=Math.atan2(b.x-hero.x,b.y-hero.y); b.x+=Math.sin(a)*5*dt; b.y+=Math.cos(a)*5*dt; if(b.flee<=0){ b.hx=b.x; b.hy=b.y; } }
    else if(fly){ const sp=b.id==="dragonfly"?1.4:0.7; const tx=b.hx+Math.sin(b.ph*sp*0.7)*2.2+Math.sin(b.ph*sp*1.9)*0.6, ty=b.hy+Math.cos(b.ph*sp*0.5)*1.6; b.x+=(tx-b.x)*Math.min(1,dt*2); b.y+=(ty-b.y)*Math.min(1,dt*2); b.z=1+Math.sin(b.ph*2.2)*0.35+(b.id==="firefly"?0.3:0);
      if(dh<2.2&&hero.moving>0.7&&b.id!=="firefly"){ b.flee=0.6; } }
    else { b.x=b.hx+Math.sin(b.ph*0.2)*0.25; }
    if(b.id==="dragonfly"&&inRiver(b.x,b.y+0.01)) b.y=b.y<(RIVER.y0+RIVER.y1)/2?RIVER.y0-0.4:RIVER.y1+0.4; }
  // ground items physics + auto pickup
  for(let i=gitems.length-1;i>=0;i--){ const g=gitems[i]; g.age=(g.age||0)+dt;
    if(g.fly){ g.fly.t+=dt/0.9; const t=Math.min(1,g.fly.t); g.x=g.fly.x0+(g.fly.x1-g.fly.x0)*t; g.y=g.fly.y0+(g.fly.y1-g.fly.y0)*t; g.z=1.6+Math.sin(t*Math.PI)*3.5-1.6*t; if(t>=1){ g.fly=null; g.z=0; g.vz=0; dirt(g.x,g.y,6); } continue; }
    if(g.vz||g.z>0){ g.z+=g.vz*dt; g.vz-=14*dt; if(g.z<=0){ g.z=0; g.vz=0; } }
    if(g.z===0&&g.age>0.6&&!hero.tf&&Math.hypot(g.x-hero.x,g.y-hero.y)<1.4&&hero.z<1){
      if(g.id==="bait"){ if(S.order&&S.order.k==="leave"){ S.order.broke=1; } gitems.splice(i,1); continue; }
      if(g.id==="stick"){ if(hero.form==="dog"){ gitems.splice(i,1); hero.carry=1; say("hero","（叼住）",0.8); paperSnd(0.15,3000,0.15); } else if(!g.tip){ g.tip=1; note("要变成狗 (2) 才能叼回去"); } continue; }
      if(ITEMS[g.id].key){ gitems.splice(i,1); gainKey(ITEMS[g.id].key); continue; }
      if(!invFull(g.id)){ gitems.splice(i,1); invAdd(g.id,g.n); floatTxt(g.x,g.y,"+"+g.n+" "+ITEMS[g.id].n); paperSnd(0.15,3000,0.15); } } }
  for(let i=floats.length-1;i>=0;i--){ floats[i].t+=dt; if(floats[i].t>1.6) floats.splice(i,1); }
  if(S.praise>0) S.praise-=dt;
  if(hero.swing>0) hero.swing-=dt; if(hero.sniff>0) hero.sniff-=dt; if(hero.fish>0) hero.fish-=dt;
  orderStep(dt);
  S._t=(S._t||0)+dt; if(S._t>0.5){ S._t=0; buildCraftLite(); checkUnlocks(); }
}

  demon.moving=Math.min(1,demon.moving+dt*5); const tf=Math.atan2(dx,dy); let dd=tf-demon.face; dd=Math.atan2(Math.sin(dd),Math.cos(dd)); demon.face+=dd*Math.min(1,dt*8); return false; }

function step(dt){

  if(hero.dig>0){ hero.dig-=dt; mx=my=0; if(Math.random()<dt*14) dirt(hero.x+Math.sin(hero.face)*0.6,hero.y+Math.cos(hero.face)*0.6,2);
    if(hero.dig<=0&&hero.digAt){ const d=hero.digAt; hero.digAt=null; if(digs.includes(d)){ digs.splice(digs.indexOf(d),1); dirt(d.x,d.y,24); thud(); drop(d.x,d.y,d.id,1); say("hero",COL[d.id][2]==="past"?"汪？（旧东西……主人会要吗？）":"汪！挖到了！",1.6); setTimeout(spawnDig,60000); } }
    else if(hero.dig<=0&&Math.hypot(hero.x-MOUND.x,hero.y-MOUND.y)<2.6&&!MOUND.dug){ MOUND.dug=1; MOUND.gone=true; STARS[0].hidden=false; STARS[0].pop=0; dirt(MOUND.x,MOUND.y,40); thud(); drop(MOUND.x+1,MOUND.y,"k_horn",1); say("hero","找到了！",1.6); } }
  let sp=F.speed;
  if(hero.dash>0){ hero.dash-=dt; sp=24; if(!(mx||my)){ mx=Math.sin(hero.face); my=Math.cos(hero.face); } }
  if(mx||my){ const nx=hero.x+mx*sp*dt, ny=hero.y+my*sp*dt; const bk=blocked(nx,ny,flying);
    if(!bk){ hero.x=nx; hero.y=ny; }
    else { if(bk!==true&&bk.puzzle==="smash"&&hero.form==="unicorn"&&hero.dash>0&&!bk.gone){ bk.gone=true; shards(bk.x,bk.y,1,26,7,"#dcd6ca"); dirt(bk.x,bk.y,20); thud(); shake=0.35; hero.dash=0; drop(bk.x,bk.y,wpick(BOULDER_TAB),1); if(RING.filter(b=>!b.gone).length<=5){ if(!RING.msg){RING.msg=1; drop(20,-8,"k_quill",1); note("石阵被撞开了");} } }
      else if(bk!==true&&(bk.kind==="dead"||bk.kind==="stump")&&hero.form==="unicorn"&&hero.dash>0&&!bk.gone){ bk.gone=true; bk.respawn=200; drop(bk.x,bk.y,"log",1); if(bk.kind==="dead"){ drop(bk.x,bk.y,"log",1); drop(bk.x,bk.y,"twig",1); } shards(bk.x,bk.y,1,14,5,"#e8dfcc"); thud(); shake=0.25; hero.dash=0; }
      else if(bk!==true&&(bk.kind==="rocks"||bk.kind==="boulder")&&!bk.puzzle&&hero.form==="unicorn"&&hero.dash>0&&!bk.gone){ breakRock(bk); shards(bk.x,bk.y,0.8,16,6,"#dcd6ca"); dirt(bk.x,bk.y,12); thud(); shake=0.25; hero.dash=0; }
      else if(bk!==true&&bk.puzzle==="smash"&&hero.form!=="unicorn"&&!bk.tip){ bk.tip=1; note(hasKey("horn")?"推不动——需要独角兽的冲撞":"推不动。要是有一只角……"); }

    const tf=Math.atan2(mx,my); let d=tf-hero.face; d=Math.atan2(Math.sin(d),Math.cos(d)); hero.face+=d*Math.min(1,dt*14); hero.moving=Math.min(1,hero.moving+dt*6); }

  if(!flying&&inRiver(hero.x,hero.y)) { hero.y=hero.y<(RIVER.y0+RIVER.y1)/2?RIVER.y0-0.3:RIVER.y1+0.3; }

  // particles
  for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.life-=dt*(p.kind==="spark"?1.6:0.9); p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt; p.vz-=14*dt; p.rot+=p.vr*dt; if(p.z<0){p.z=0;p.vz*=-0.3;p.vx*=0.6;p.vy*=0.6;} if(p.life<=0) parts.splice(i,1); }
  for(let i=bubbles.length-1;i>=0;i--){ bubbles[i].t+=dt; if(bubbles[i].t>bubbles[i].dur) bubbles.splice(i,1); }
  // camera target: ahead of the hero so she sits in the lower-middle and the horizon stays in view
  cam.tx+=(hero.x+Math.sin(cam.yaw)*5-cam.tx)*Math.min(1,dt*4); cam.ty+=(hero.y+Math.cos(cam.yaw)*5-cam.ty)*Math.min(1,dt*4);

  // tips
  tipTimer-=dt; if(tipTimer<=0){ tipTimer=0.4; let t=""; const nearM=Math.hypot(demon.x-hero.x,demon.y-hero.y)<3.2; const hasCol=S.inv.some(s=>s&&ITEMS[s.id].col);
    if(placing) t="空格：放下"+BUILDS[placing.id].n+" · Esc 取消"; else if(nearM&&!demon.hidden) t=hasCol?"空格：和主人说话（可以献上收藏）":"空格：和主人说话";
    else if(hero.form==="human"&&builds.some(b=>b.bid==="cabinet"&&Math.hypot(b.x-hero.x,b.y-hero.y)<2.6)) t="空格：翻看收藏柜";
    else if(hero.form==="dog"&&isNight()&&builds.some(b=>b.bid==="doghouse"&&Math.hypot(b.x-hero.x,b.y-hero.y)<2.4)) t="空格：钻进狗窝睡到天亮";

    else if(hero.form==="bird"){ const n=nearNestTree(); t=n&&hero.z>1.2?(n.nest.cd>0?"鸟巢是空的":"空格：翻找鸟巢"):"飞到有鸟巢的高树旁"; }

/* ---------------- drawing ---------------- */
function drawSky(){ const hy=horizonY();
  const g=cx.createLinearGradient(0,0,0,hy+40); g.addColorStop(0,"#f3efe6"); g.addColorStop(1,"#ebe5d8"); cx.fillStyle=g; cx.fillRect(0,0,W,hy+60);
  // panorama cylinder (mirror-tiled so there is no seam)
  const pan=IMG.panorama; if(pan&&pan.complete){ const ph=Math.max(H*0.5,260), pw=pan.width*ph/pan.height; const tile=pw*2; // pan + mirrored pan
    const circ=tile*2; // full turn = 2 tiles
    let off=-((cam.yaw/(Math.PI*2))*circ)%tile; if(off>0) off-=tile; const top=hy-ph*0.585;
    cx.globalAlpha=0.8;
    for(let x=off;x<W;x+=tile){ cx.drawImage(pan,x,top,pw,ph); cx.save(); cx.translate(x+tile,top); cx.scale(-1,1); cx.drawImage(pan,0,0,pw,ph); cx.restore(); }
    cx.globalAlpha=1; }
}
function drawGround(){ const hy=horizonY();
  // base ground (paper) with distance haze
  const g=cx.createLinearGradient(0,hy-4,0,H); g.addColorStop(0,"rgba(236,231,220,0.0)"); g.addColorStop(0.04,"rgba(236,231,220,0.92)"); g.addColorStop(1,"#e6dfcf"); cx.fillStyle=g; cx.fillRect(0,hy-4,W,H-hy+4);
  // soft horizon haze line
  cx.strokeStyle="rgba(60,50,40,0.25)"; cx.lineWidth=1; cx.beginPath(); for(let x=0;x<=W;x+=8){ const y=hy+6+Math.sin(x*0.02+cam.yaw*9)*1.5; x?cx.lineTo(x,y):cx.moveTo(x,y); } cx.stroke();
  // big ground hatch patches (world-anchored) for texture
  cx.lineCap="round";
  // path
  drawPath(); drawRiver();
  // marks
  for(const m of MARKS){ const p=proj(m.x,m.y,0); if(!p||p.x<-20||p.x>W+20||p.y<hy||p.y>H+20) continue; const fade=Math.min(1,(p.y-hy)/(H*0.25));
    cx.strokeStyle=`rgba(40,34,28,${0.18+0.35*fade})`; cx.lineWidth=Math.max(0.5,p.s*0.035);
    if(m.k===0){ cx.beginPath(); for(let i=0;i<m.n+1;i++){ const a=-1.57+(i-m.n/2)*0.35; cx.moveTo(p.x+(i-m.n/2)*p.s*0.06,p.y); cx.lineTo(p.x+(i-m.n/2)*p.s*0.06+Math.cos(a)*p.s*m.l*0.5,p.y+Math.sin(a)*p.s*m.l); } cx.stroke(); }
